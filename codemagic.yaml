workflows:
  android-workflow:
    name: Android Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Clean and Build Android APK
        script: |
          # Borrar la caché de Gradle para forzar una descarga limpia
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/
          
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
